# X-ray source: NSI / Rigaku M237 X-ray Monoblock.
# Source: https://rigaku.com/products/nsi/standard-xray-sources/m237 (read 2026-10-09).
# Values not stated on that page are null and must come from NSI/Rigaku (spectrum, focal spot, window).
model: M237
kv_range: [35, 70]          # standard; custom 15-80 kV available
power_max_w: 10
current_range_ua: [5, 200]
target:
  type: transmission
  material: W               # Gil, 2026-10-09
  thickness_um: null        # not stated; simulation uses 5 um W self-filtration (PLACEHOLDER)
window:
  material: Be
  thickness_mm: 0.0         # Gil: thin, negligible (exact value not recalled)
added_filtration: []        # none (Gil); 1-2 mm Al easy to add — simulated as an option
focal_spot_mm: 0.5          # Gil: 'effectively 0.5 mm or better' in past units; not stated by NSI
depth_to_focal_spot_mm: 2.4 # stated
cone_angle_deg: 110         # full width
cathode: tungsten filament
hv_polarity: grounded anode
operating_kv: 70             # dental (Gil, 2026-10-09)
spectrum: null              # measured spectrum still to request from NSI/Rigaku; simulate/spectrum.py models it (Kramers, PLACEHOLDER)
