# Older multi-emitter DTS system (2018): setup A, the one Andy040618/air belongs to (reports/real_data_v2.md).
# Members, by flat-field match: Andy040618 only (rows A–D, 26 emitters, own flats). Fingers is NOT in this setup
# (real_data_v1 assumed it was; v2 §2). The v1 run config for these data is legacy_emitter_2018.yaml.
roots:
  v1: /Users/gtravish/Downloads/sendgb-H3vf2HxCCaz

detector:
  size_mm: [114.0, 64.0]      # [cmd.txt]
  full_shape: [1300, 2304]    # measured
  full_scale: 16383           # measured
  dark_level: 0.0             # PLACEHOLDER: no dark frames supplied

keys:                         # Andy040618's own keys.txt (named in cmd.txt) was not supplied
  file: null
  pitch_mm: 10.0              # [Gil 2026-10-27] emitter pitch 10 mm; parallax confirms a regular square grid (x/y 1.008)
  orientation: identity       # measured (parallax, Andy040618)
  rotation_deg: 0.44          # measured (parallax); the air fit gives +0.64
  grid_centre_rows_A_D_mm: [5.3, -12.6]   # inferred: air fit with the 10 mm grid and aimed emission (detector-centred frame; mean of the 26 emitters)

source_distance_mm:
  value: 145.0                # PLACEHOLDER (inferred): air images with the 10 mm grid and aimed emission, profile minimum; real_data_v2 §5.3
  placeholder: true
  estimates:
    air_images_pitch_fixed: 145.0   # measured profile minimum (raw and gain-corrected), flat 140–150; 10 % rms rise at ~135 and ~165–180
    cmd_txt: 120.0                  # [cmd.txt] --distance-source-detector
    v1_air_isotropic: 124.8         # v1, free positions (12.7 mm peak grid, not the sources), isotropic emission
    gil: unknown                    # Gil 2026-10-27: no distances on record

datasets:
  andy040618:
    root: v1
    projections: Andy040618/andy
    flats: Andy040618/air
    attenuation: [Andy040618/atten2304x1300, Andy040618/atten1152x650, Andy040618/atten576x325]
